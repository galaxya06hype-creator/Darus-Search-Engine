[project]
name = "rivalsearchmcp"
version = "1.0.0"
description = "Advanced web research and content discovery MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "lxml>=4.9.0",
    "pillow>=10.0.0",
    "websockets>=11.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "typing-extensions>=4.8.0",
    "pydantic>=2.5.0",
    "pytrends==4.9.2",
    "pandas>=2.2.0",
    "urllib3<2.0.0",
    "python-dotenv>=1.0.0",
    "fastmcp==3.2.4",
    "markdown>=3.5.0",
    "feedparser>=6.0.12",
    "pypdf>=6.6.0",
    "python-docx>=1.2.0",
    "easyocr>=1.7.2",
    "scrapling[fetchers]>=0.3.0",
    "markdownify>=0.11",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "ruff>=0.0.285",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rival_search_mcp"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101"]
