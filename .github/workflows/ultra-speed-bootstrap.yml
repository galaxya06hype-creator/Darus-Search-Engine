name: Build Darus Search Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, 'ci: bootstrap upstream') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import upstream source
        run: |
          rm -rf /tmp/upstream
          git clone --depth 1 https://github.com/damionrashford/RivalSearchMCP.git /tmp/upstream
          rsync -a /tmp/upstream/ ./ \
            --exclude '.git' \
            --exclude 'README.md' \
            --exclude '.github/workflows/ultra-speed-bootstrap.yml' \
            --exclude 'scripts/ultra_speed_patch.py'

      - name: Apply Ultra Speed optimizations
        run: python3 scripts/ultra_speed_patch.py

      - name: Remove transient build files
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache logs

      - name: Validate Python syntax
        run: python3 -m compileall -q rival_search_mcp server.py

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "ci: bootstrap upstream" || echo "No changes to commit"
          git push origin HEAD:main
